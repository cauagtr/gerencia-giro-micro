}

// ── 5. ANÁLISES ESTATÍSTICAS ──
function relEstatistico() {
  const sists = sistemasAtivos()
  const todos = sists.flatMap(s => filtrar(s))
  const blocos = []
  // Faixas de valor
  const faixas = [[0, 5000, 'até R$ 5 mil'], [5000.01, 10000, 'R$ 5–10 mil'], [10000.01, 20000, 'R$ 10–20 mil'], [20000.01, 50000, 'R$ 20–50 mil'], [50000.01, 100000, 'R$ 50–100 mil'], [100000.01, 250000, 'R$ 100–250 mil'], [250000.01, Infinity, 'acima de R$ 250 mil']]
  const linhasFx = []
  sists.forEach(s => faixas.forEach(([a, b, rot]) => {
    const l = filtrar(s).filter(r => r.valor >= a && r.valor <= b)
    if (!l.length) return
    const r = resumo(l)
    linhasFx.push([SIS[s].curto, rot, r.total, r.decididas, r.convQtd, r.ic, r.leadMediana])
  }))
  blocos.push({ tipo: 'tabela', titulo: 'Conversão por faixa de valor pedido', aba: 'Faixas de valor',
    sub: 'Mostra se pedidos maiores são mais ou menos aprovados. Faixas com IC muito largo têm poucas propostas: não tire conclusão delas.',
    colunas: [{ rot: 'Sistema', tipo: 'txt' }, { rot: 'Faixa', tipo: 'txt' }, { rot: 'Propostas', tipo: 'int' }, { rot: 'Decididas', tipo: 'int' }, { rot: 'Conversão', tipo: 'pct' }, { rot: 'IC 95%', tipo: 'ic' }, { rot: 'Cadastro→concessão', tipo: 'dias' }],
    linhas: linhasFx })
  // Por linha
  const linhasL = []
  sists.forEach(s => {
    const g = {}
    filtrar(s).forEach(r => { (g[r.linha] = g[r.linha] || []).push(r) })
    Object.entries(g).forEach(([lin, l]) => { const r = resumo(l); linhasL.push([SIS[s].curto, lin, r.total, r.ativas, r.decididas, r.convQtd, r.ic, r.valorConc, r.ticketConc, r.leadMediana]) })
  })
  linhasL.sort((a, b) => b[2] - a[2])
  blocos.push({ tipo: 'tabela', titulo: 'Desempenho por linha de crédito', aba: 'Por linha',
    colunas: [{ rot: 'Sistema', tipo: 'txt' }, { rot: 'Linha', tipo: 'txt' }, { rot: 'Propostas', tipo: 'int' }, { rot: 'Em andamento', tipo: 'int' }, { rot: 'Decididas', tipo: 'int' }, { rot: 'Conversão', tipo: 'pct' }, { rot: 'IC 95%', tipo: 'ic' }, { rot: 'Valor concedido', tipo: 'brl' }, { rot: 'Ticket médio', tipo: 'brl' }, { rot: 'Cadastro→concessão', tipo: 'dias' }],
    linhas: linhasL })
  // Distribuição do tempo até a concessão
  const leads = todos.filter(r => r.final === 'conc' && r.leadTime !== null).map(r => r.leadTime)
  const hist = [[0, 7, 'até 7 dias'], [8, 15, '8 a 15'], [16, 30, '16 a 30'], [31, 60, '31 a 60'], [61, 90, '61 a 90'], [91, 180, '91 a 180'], [181, 99999, 'mais de 180']]
  blocos.push({ tipo: 'grafico', titulo: 'Quanto tempo leva do cadastro à concessão', quebra: true,
    sub: leads.length ? `${leads.length} concedidas · mediana ${fmtDias(mediana(leads))} · metade fica entre ${fmtDias(quantil(leads, .25))} e ${fmtDias(quantil(leads, .75))} · 90% saem em até ${fmtDias(quantil(leads, .9))}.` : 'Sem concedidas no período.',
    svg: gBarrasH({ itens: hist.map(([a, b, rot]) => { const n = leads.filter(x => x >= a && x <= b).length; return { rot, val: n, cor: '#003366', extra: leads.length ? fmtPct(n / leads.length, 0) : '' } }) }) })
  // Dia da semana dos cadastros
  const dias = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado']
  const contDia = dias.map((_, i) => todos.filter(r => r.cad && paraData(r.cad).getDay() === i).length)
  blocos.push({ tipo: 'grafico', titulo: 'Em que dia da semana as propostas são cadastradas',
    svg: gBarrasH({ itens: dias.map((d, i) => ({ rot: d, val: contDia[i], cor: i === 0 || i === 6 ? '#94A3B8' : '#003366', extra: soma(contDia) ? fmtPct(contDia[i] / soma(contDia), 0) : '' })), larguraRot: 120 }) })
  // Municípios — concentração (Pareto)
  const mun = {}
  todos.filter(r => r.final === 'conc').forEach(r => { const m = r.municipio || '(sem município)'; mun[m] = mun[m] || { n: 0, v: 0 }; mun[m].n++; mun[m].v += r.valor })
  const ordem = Object.entries(mun).sort((a, b) => b[1].v - a[1].v)
  const totV = soma(ordem.map(x => x[1].v))
  let acum = 0
  const linhasM = ordem.slice(0, 20).map(([m, x]) => { acum += x.v; return [m, x.n, x.v, totV ? x.v / totV : null, totV ? acum / totV : null] })
  const n80 = (() => { let a = 0; for (let i = 0; i < ordem.length; i++) { a += ordem[i][1].v; if (a >= 0.8 * totV) return i + 1 } return ordem.length })()
  blocos.push({ tipo: 'tabela', titulo: 'Onde o crédito concedido se concentra (municípios)', aba: 'Municípios', quebra: true,
    sub: ordem.length ? `${ordem.length} municípios receberam crédito; <b>${n80}</b> deles (${fmtPct(n80 / ordem.length, 0)}) concentram 80% do valor concedido.` : '',
    colunas: [{ rot: 'Município', tipo: 'txt' }, { rot: 'Concedidas', tipo: 'int' }, { rot: 'Valor concedido', tipo: 'brl' }, { rot: '% do valor', tipo: 'pct' }, { rot: '% acumulado', tipo: 'pct' }],
    linhas: linhasM })
  // Coortes de maturação
  const meses = mesesDaBase()
  const linhasC = []
  sists.forEach(s => meses.forEach(m => {
    const l = filtrar(s).filter(r => r.cad && r.cad.slice(0, 7) === m)
    if (!l.length) return
    const dec = l.filter(r => r.final), conc = l.filter(r => r.final === 'conc')
    linhasC.push([SIS[s].curto, rotMes(m), l.length, dec.length / l.length, conc.length / l.length, dec.length ? conc.length / dec.length : null, mediana(conc.map(r => r.leadTime).filter(v => v !== null)), l.filter(r => !r.final).length])
  }))
  blocos.push({ tipo: 'tabela', titulo: 'Safras (coortes) por mês de cadastro', aba: 'Safras',
    sub: 'Acompanha cada grupo de propostas cadastradas no mesmo mês: quanto já foi decidido e quanto virou concessão. Safras recentes ainda estão abertas.',
    colunas: [{ rot: 'Sistema', tipo: 'txt' }, { rot: 'Safra', tipo: 'txt' }, { rot: 'Cadastradas', tipo: 'int' }, { rot: '% decididas', tipo: 'pct' }, { rot: '% concedidas (do total)', tipo: 'pct' }, { rot: 'Conversão (das decididas)', tipo: 'pct' }, { rot: 'Cadastro→concessão', tipo: 'dias' }, { rot: 'Ainda em andamento', tipo: 'int' }],
    linhas: linhasC })
  // Notas
  const notas = []
  const fxConf = linhasFx.filter(l => l[3] >= 15)
  if (fxConf.length >= 2) {
    const mx = fxConf.reduce((a, b) => (b[4] > a[4] ? b : a)), mn = fxConf.reduce((a, b) => (b[4] < a[4] ? b : a))
    notas.push({ ico: '💡', txt: `Faixa com maior conversão: <b>${mx[1]}</b> (${mx[0]}, ${fmtPct(mx[4])}); menor: <b>${mn[1]}</b> (${mn[0]}, ${fmtPct(mn[4])}).` })
  }
  if (soma(contDia)) { const fds = (contDia[0] + contDia[6]) / soma(contDia); notas.push({ ico: '📅', txt: `${fmtPct(fds, 0)} dos cadastros caem no fim de semana — por isso a comparação semanal é mais estável que a diária.` }) }
  if (ordem.length) notas.push({ ico: '🗺️', txt: `Concentração geográfica: os 3 maiores municípios somam ${fmtPct(soma(ordem.slice(0, 3).map(x => x[1].v)) / (totV || 1), 0)} do valor concedido.` })
  blocos.unshift({ tipo: 'notas', titulo: 'Principais achados', itens: notas.length ? notas : [{ ico: '•', txt: 'Poucos dados no período para tirar conclusões.' }] })
  return { titulo: 'Análises estatísticas', blocos }
}

// ── 6. CARTEIRA ATUAL (pessoa × fase) ──
function relCarteira() {
  const sists = sistemasAtivos()
  const linhas = []
  sists.forEach(s => {
    const g = {}
    filtrar(s, { semPeriodo: true }).filter(r => !r.final).forEach(r => { (g[r.resp] = g[r.resp] || []).push(r) })
    Object.entries(g).sort((a, b) => b[1].length - a[1].length).forEach(([p, l]) =>
      linhas.push([SIS[s].curto, p, ...FASES.map(f => l.filter(r => r.fase === f).length), l.length, soma(l.map(r => r.valor)), l.filter(r => r.diasParado > DIAS_PARADA).length]))
  })
  return { titulo: 'Carteira atual em andamento', sub: 'Todas as propostas em andamento hoje (ignora o período do filtro).', blocos: [

      colunas: [{ rot: 'Sistema', tipo: 'txt' }, { rot: 'Responsável', tipo: 'txt' }, ...FASES.map(f => ({ rot: f, tipo: 'int' })), { rot: 'Total', tipo: 'int' }, { rot: 'Valor', tipo: 'brl' }, { rot: `+${DIAS_PARADA}d`, tipo: 'int' }],
      linhas,
      total: ['', 'Total', ...FASES.map((_, i) => soma(linhas.map(l => l[2 + i]))), soma(linhas.map(l => l[2 + FASES.length])), soma(linhas.map(l => l[3 + FASES.length])), soma(linhas.map(l => l[4 + FASES.length]))] },
  ]}
}

  document.querySelectorAll('.aba').forEach(b => b.classList.toggle('ativa', b.dataset.aba === aba))

function renderAba() {

// ════════════ AÇÕES SOBRE PROPOSTAS (valem para os sistemas também) ════════════
// campo: 'resp' (responsável do Micro / analista do Giro Fácil) ou 'estag' (estagiário do Giro Fácil)
async function atribuir(sis, mapa, campo) {   // mapa: { codigo: novoNome }
  const porNome = {}
  Object.entries(mapa).forEach(([c, n]) => { (porNome[n] = porNome[n] || []).push(c) })
  for (const [nome, cods] of Object.entries(porNome)) {
    const corpo = campo === 'estag' ? { estagiario: nome } : { responsavel: nome, responsavel_final: nome }
    await patchEmLotes(SIS[sis].tabela, cods, corpo)
  }
  await atualizarReferencia(sis, mapa, campo)
  DADOS[sis].forEach(r => { if (mapa[r.codigo] !== undefined) { if (campo === 'estag') r.estag = mapa[r.codigo]; else r.resp = mapa[r.codigo] } })
}
// A planilha de referência do último processamento também é atualizada, para que
// o próximo processamento não devolva o nome antigo a uma proposta.
async function atualizarReferencia(sis, mapa, campo) {
  try {
    const refs = await api(`${SIS[sis].ref}?select=id,dados&order=criado_em.desc&limit=1`)
    if (!refs || !refs[0] || !Array.isArray(refs[0].dados)) return
    const chaveCampo = campo === 'estag' ? 'estagiario' : 'responsavel_final'
    let mudou = false
    const dados = refs[0].dados.map(d => {
      const c = String(d.codigo || '').trim()
      if (mapa[c] !== undefined) { mudou = true; return { ...d, [chaveCampo]: mapa[c] } }
      return d
    })
    if (mudou) await api(`${SIS[sis].ref}?id=eq.${refs[0].id}`, { method: 'PATCH', prefer: 'return=minimal', body: { dados } })
  } catch(e) { console.warn('referência não atualizada', e) }
}
function distribuirIgual(codigos, pessoas) {
  const mapa = {}
  ;[...codigos].sort().forEach((c, i) => { mapa[c] = pessoas[i % pessoas.length] })
  return mapa
}
async function arquivarPropostas(sis, cods, arquivar = true) {
  await patchEmLotes(SIS[sis].tabela, cods, { arquivada: arquivar })
  const s = new Set(cods); DADOS[sis].forEach(r => { if (s.has(r.codigo)) r.arquivada = arquivar })
}
async function excluirPropostas(sis, cods) {
  for (let i = 0; i < cods.length; i += 150) {
    const lote = cods.slice(i, i + 150)
    const copias = await api(`${SIS[sis].tabela}?select=*&${listaCodigos(lote)}`)
    if (copias && copias.length) await api('backup_excluidas', { method: 'POST', prefer: 'return=minimal', body: copias.map(c => ({ codigo: (sis === 'fgf' ? 'FGF-' : '') + c.codigo, dados: c })) })
    await api(`${SIS[sis].tabela}?${listaCodigos(lote)}`, { method: 'DELETE', prefer: 'return=minimal' })
  }
  const s = new Set(cods); DADOS[sis] = DADOS[sis].filter(r => !s.has(r.codigo))
}
async function moverLinha(sis, cods, novaLinha) {
  await patchEmLotes(SIS[sis].tabela, cods, { linha_credito: novaLinha })
  const s = new Set(cods); DADOS[sis].forEach(r => { if (s.has(r.codigo)) { r.linhaBruta = novaLinha; r.linha = linhaOficial(sis, novaLinha) } })
}

          ${at.length ? `<button class="btn btn-sm" onclick="RED.sis='${sis}'; RED.pessoa='${esc(c.nome)}'; RED.campo='${campoDoPapel(c.papel)}'; irPara('redistribuir')">Redistribuir</button>` : ''}

// Nomes que aparecem nas propostas mas não estão cadastrados
function semCadastro(sis) {
  const conhecidos = new Set(CFG.colabs.filter(c => c.sistema === sis).map(c => c.nome))
  const nomes = {}
  DADOS[sis].forEach(r => [r.resp, r.estag].filter(Boolean).forEach(n => { if (n !== 'N/A' && !conhecidos.has(n)) nomes[n] = (nomes[n] || 0) + 1 }))
  const l = Object.entries(nomes)
  if (!l.length || !CFG.ok) return ''
  return `<div class="alerta alerta-aviso" style="margin-top:14px">Nomes nas propostas que não estão no cadastro: ${l.map(([n, q]) => `<b>${esc(n)}</b> (${q})`).join(', ')}. Cadastre como inativo para manter o histórico organizado, ou redistribua as propostas.</div>`
}
function corLivre(sis) {
  const usadas = new Set(CFG.colabs.filter(c => c.sistema === sis).map(c => c.cor.toUpperCase()))

    </div>

      <td>${l.ativa ? '<span class="tag tag-ok">Ativa</span>' : '<span class="tag tag-off">Inativa</span>'}</td>

      </td></tr>`).join('') || `<tr><td colspan="8" class="vazio">Nenhuma linha cadastrada.</td></tr>`}
    </tbody></table></div>
    ${semRegra.length ? `<div class="alerta alerta-aviso" style="margin-top:14px">Textos de linha nas propostas que nenhuma regra reconhece: ${semRegra.map(([n, c]) => `<b>${esc(n)}</b> (${c.t})`).join(', ')}.</div>` : ''}

async function salvarLinha(id) {
  const sis = LIN_SIS
  const nome = document.getElementById('ml-nome').value.trim()
  const palavras = document.getElementById('ml-pal').value.split(',').map(x => semAcentoUp(x).trim()).filter(Boolean).join(',')
  const prioridade = parseInt(document.getElementById('ml-pri').value, 10) || 100
  const cor = document.getElementById('ml-cor').value
  if (!nome || !palavras) { toast('Preencha o nome e ao menos uma palavra.', true); return }
  const dup = CFG.linhas.find(x => x.sistema === sis && x.nome === nome && x.id !== id)
  if (dup) { toast('Já existe uma linha com esse nome.', true); return }
  try {
    if (id) {
      const antiga = CFG.linhas.find(x => x.id === id)
      await api(`config_linhas?id=eq.${id}`, { method: 'PATCH', prefer: 'return=minimal', body: { nome, palavras, prioridade, cor } })
      if (antiga.nome !== nome) {
        const cods = DADOS[sis].filter(r => r.linhaBruta === antiga.nome).map(r => r.codigo)
        if (cods.length) await moverLinha(sis, cods, nome)
      }
      await registrarLog(sis, 'Linha editada', { de: antiga, para: { nome, palavras, prioridade, cor } })
    } else {
      await api('config_linhas', { method: 'POST', prefer: 'return=minimal', body: { sistema: sis, nome, palavras, prioridade, cor, ativa: true } })
      await registrarLog(sis, 'Linha adicionada', { nome, palavras, prioridade })
    }
    await carregarConfig()
    DADOS[sis].forEach(r => { r.linha = linhaOficial(sis, r.linhaBruta) })
    fecharModal(); renderLinhas(); toast('✓ Linha salva')
    if (linhaOficial(sis, nome) !== nome) toast(`Atenção: o nome "${nome}" não contém as palavras da regra — propostas movidas para ela não seriam reconhecidas.`, true)
  } catch(e) { toast('Erro: ' + e.message, true) }
}
async function alternarLinha(id, ativa) {
  const l = CFG.linhas.find(x => x.id === id)
  try {
    await api(`config_linhas?id=eq.${id}`, { method: 'PATCH', prefer: 'return=minimal', body: { ativa } })
    await registrarLog(l.sistema, ativa ? 'Linha reativada' : 'Linha desativada', { nome: l.nome })

async function excluirRegraLinha(id) {

  catch(e) { toast('Erro: ' + e.message, true) }
}

function modalDestinoLinha(id, desativar) {
  const l = CFG.linhas.find(x => x.id === id), sis = l.sistema
  const ps = DADOS[sis].filter(r => r.linha === l.nome)

    <div style="margin-bottom:10px"><label class="rot">Quais propostas</label><select id="dl-escopo"><option value="ativas">Só as ${at.length} em andamento</option><option value="todas">Todas as ${ps.length}</option></select></div>

    ${opcaoDestino('mover', 'Mover para outra linha', 'Muda a linha das propostas.', `<div style="margin-top:6px"><select id="dl-para">${outras.map(x => `<option>${esc(x.nome)}</option>`).join('')}</select></div>`)}
    ${opcaoDestino('arquivar', 'Arquivar', 'Somem das listas e do painel, mas ficam guardadas (dá para desarquivar no sistema).')}
    ${opcaoDestino('excluir', 'Excluir do sistema', 'Apaga as propostas. Uma cópia fica em backup_excluidas.')}
    <div class="modal-acoes"><button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn ${desativar ? 'btn-perigo' : 'btn-pri'}" id="dl-ok" onclick="confirmarDestinoLinha(${id}, ${desativar})">${desativar ? 'Desativar e aplicar' : 'Aplicar'}</button></div>`)
}
async function confirmarDestinoLinha(id, desativar) {
  const l = CFG.linhas.find(x => x.id === id), sis = l.sistema
  const destino = (document.querySelector('input[name=destino]:checked') || {}).value
  const escopo = document.getElementById('dl-escopo').value
  const cods = DADOS[sis].filter(r => r.linha === l.nome && (escopo === 'todas' || !r.final)).map(r => r.codigo)
  if (destino === 'excluir' && !confirm(`Excluir ${cods.length} proposta(s) do ${SIS[sis].nome}? Uma cópia fica no backup.`)) return
  const btn = document.getElementById('dl-ok'); btn.disabled = true; btn.textContent = 'Aplicando...'
  try {
    if (cods.length) {
      if (destino === 'mover') { const para = document.getElementById('dl-para').value; if (!para) throw new Error('Não há outra linha ativa.'); await moverLinha(sis, cods, para) }
      if (destino === 'arquivar') await arquivarPropostas(sis, cods, true)
      if (destino === 'excluir') await excluirPropostas(sis, cods)
    }
    if (desativar) await api(`config_linhas?id=eq.${id}`, { method: 'PATCH', prefer: 'return=minimal', body: { ativa: false } })
    await registrarLog(sis, desativar ? 'Linha desativada' : 'Propostas de linha tratadas', { linha: l.nome, destino, escopo, propostas: cods.length })
    await carregarConfig(); fecharModal(); renderLinhas()
    toast(`✓ ${desativar ? l.nome + ' desativada' : 'Aplicado'}${destino !== 'manter' ? ` · ${cods.length} proposta(s)` : ''}`)
  } catch(e) { toast('Erro: ' + e.message, true); btn.disabled = false; btn.textContent = 'Tentar de novo' }
}

// ════════════ REDISTRIBUIR ════════════
const RED = { sis: 'micro', pessoa: '', campo: 'resp', situacao: 'ativas', linha: '', fase: '', busca: '', sel: new Set() }
function pessoasAtivas(sis, campo) {
  const papel = sis === 'micro' ? 'responsavel' : campo === 'estag' ? 'estagiario' : 'analista'
  return CFG.colabs.filter(c => c.sistema === sis && c.ativo && c.papel === papel).map(c => c.nome)
}
function listaRedistribuir() {
  let l = DADOS[RED.sis].filter(r => !r.arquivada)
  if (RED.situacao === 'ativas') l = l.filter(r => !r.final)
  if (RED.pessoa) l = l.filter(r => (RED.campo === 'estag' ? r.estag : r.resp) === RED.pessoa)
  if (RED.linha) l = l.filter(r => r.linha === RED.linha)
  if (RED.fase) l = l.filter(r => r.fase === RED.fase)
  if (RED.busca) { const b = semAcentoUp(RED.busca); l = l.filter(r => semAcentoUp(r.codigo + ' ' + r.cliente).includes(b)) }
  return l.sort((a, b) => (b.diasParado || 0) - (a.diasParado || 0))
}
function renderRedistribuir() {
  if (RED.sis === 'micro') RED.campo = 'resp'
  const lista = listaRedistribuir()
  const nomesNaBase = [...new Set(DADOS[RED.sis].map(r => RED.campo === 'estag' ? r.estag : r.resp))].sort((a, b) => a === 'N/A' ? -1 : b === 'N/A' ? 1 : a.localeCompare(b, 'pt-BR'))
  const ativos = pessoasAtivas(RED.sis, RED.campo)
  const papelTxt = RED.sis === 'micro' ? 'responsável' : RED.campo === 'estag' ? 'estagiário' : 'analista'
  RED.sel = new Set([...RED.sel].filter(c => lista.find(r => r.codigo === c)))
  document.getElementById('conteudo').innerHTML = `<div class="card">
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:6px">
      <div class="card-titulo" style="margin:0">🔁 Redistribuir propostas</div>
      <div class="seg">${['micro', 'fgf'].map(s => `<button class="${RED.sis === s ? 'on' : ''}" onclick="RED.sis='${s}'; RED.pessoa=''; RED.linha=''; RED.sel.clear(); renderRedistribuir()">${SIS[s].nome}</button>`).join('')}</div>
      ${RED.sis === 'fgf' ? `<div class="seg"><button class="${RED.campo === 'resp' ? 'on' : ''}" onclick="RED.campo='resp'; RED.pessoa=''; RED.sel.clear(); renderRedistribuir()">Analista</button><button class="${RED.campo === 'estag' ? 'on' : ''}" onclick="RED.campo='estag'; RED.pessoa=''; RED.sel.clear(); renderRedistribuir()">Estagiário</button></div>` : ''}
    </div>
    <div class="card-sub">Filtre, marque as propostas e escolha para quem vão. A mudança vale na hora para o ${SIS[RED.sis].nome}.</div>
    <div class="linha-form" style="margin-bottom:12px">
      <div><label class="rot">${papelTxt[0].toUpperCase() + papelTxt.slice(1)} atual</label><select onchange="RED.pessoa=this.value; RED.sel.clear(); renderRedistribuir()"><option value="">Todos</option>${nomesNaBase.map(n => `<option ${RED.pessoa === n ? 'selected' : ''} value="${esc(n)}">${esc(n)}${n !== 'N/A' && !ativos.includes(n) ? ' (inativo)' : ''}</option>`).join('')}</select></div>
      <div><label class="rot">Situação</label><select onchange="RED.situacao=this.value; renderRedistribuir()"><option value="ativas" ${RED.situacao === 'ativas' ? 'selected' : ''}>Em andamento</option><option value="todas" ${RED.situacao === 'todas' ? 'selected' : ''}>Todas</option></select></div>
      <div><label class="rot">Fase</label><select onchange="RED.fase=this.value; renderRedistribuir()"><option value="">Todas</option>${FASES.map(f => `<option ${RED.fase === f ? 'selected' : ''}>${f}</option>`).join('')}</select></div>
      <div><label class="rot">Linha</label><select onchange="RED.linha=this.value; renderRedistribuir()"><option value="">Todas</option>${[...new Set(DADOS[RED.sis].map(r => r.linha))].sort().map(l => `<option ${RED.linha === l ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></div>
      <div><label class="rot">Buscar</label><input type="text" value="${esc(RED.busca)}" placeholder="código ou cliente" onchange="RED.busca=this.value; renderRedistribuir()"></div>
    </div>
    <div class="alerta alerta-info" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px">
      <b id="red-cont">${RED.sel.size} selecionada(s)</b> de ${lista.length}
      <span style="margin-left:auto">Passar para</span>
      <select id="red-para">${ativos.map(n => `<option>${esc(n)}</option>`).join('')}<option value="N/A">N/A (sem ${papelTxt})</option></select>
      <button class="btn btn-pri btn-sm" onclick="aplicarRedistribuicao('uma')">Aplicar</button>
      <button class="btn btn-sm" onclick="modalDividir()">Dividir igualmente…</button>
    </div>
    <div class="tab-wrap" style="max-height:62vh;overflow-y:auto"><table class="t"><thead><tr>
      <th><input type="checkbox" ${lista.length && RED.sel.size === lista.length ? 'checked' : ''} onchange="RED.sel = this.checked ? new Set(listaRedistribuir().map(r => r.codigo)) : new Set(); renderRedistribuir()"></th>
      <th>Código</th><th>Cliente</th><th>Linha</th><th>Etapa</th><th>${RED.sis === 'fgf' ? 'Analista' : 'Responsável'}</th>${RED.sis === 'fgf' ? '<th>Estagiário</th>' : ''}<th class="n">Dias parada</th><th class="n">Valor</th></tr></thead><tbody>
      ${lista.slice(0, 800).map(r => `<tr>
        <td><input type="checkbox" ${RED.sel.has(r.codigo) ? 'checked' : ''} onchange="if(this.checked) RED.sel.add('${r.codigo}'); else RED.sel.delete('${r.codigo}'); document.getElementById('red-cont').textContent = RED.sel.size + ' selecionada(s)'"></td>
        <td class="mono"><b>${esc(r.codigo)}</b>${r.transferencia ? ' <span title="transferência">⇄</span>' : ''}</td><td>${esc(r.cliente) || '—'}</td>
        <td><span class="bolinha" style="background:${corLinha(r.sis, r.linha)}"></span>${esc(r.linha)}</td><td>${esc(etapaLimpa(r.etapa))}</td>
        <td><span class="bolinha" style="background:${corPessoa(r.sis, r.resp)}"></span>${esc(r.resp)}</td>${r.sis === 'fgf' ? `<td>${esc(r.estag)}</td>` : ''}
        <td class="n" style="${r.diasParado > DIAS_PARADA ? 'color:#B91C1C;font-weight:600' : ''}">${r.diasParado ?? '—'}</td><td class="n">${fmtBRL(r.valor)}</td></tr>`).join('') || `<tr><td colspan="9" class="vazio">Nenhuma proposta com esses filtros.</td></tr>`}
    </tbody></table></div>
    ${lista.length > 800 ? `<div class="card-sub" style="margin-top:8px">Mostrando as 800 primeiras de ${lista.length}. "Selecionar tudo" marca todas as ${lista.length}.</div>` : ''}
  </div>`
}
async function aplicarRedistribuicao(modo, pessoas) {
  const cods = [...RED.sel]
  if (!cods.length) { toast('Marque ao menos uma proposta.', true); return }
  const mapa = modo === 'dividir' ? distribuirIgual(cods, pessoas) : Object.fromEntries(cods.map(c => [c, document.getElementById('red-para').value]))
  try {
    await atribuir(RED.sis, mapa, RED.campo)
    await registrarLog(RED.sis, 'Propostas redistribuídas', { campo: RED.campo === 'estag' ? 'estagiario' : 'responsavel', quantidade: cods.length, resumo: contarPor(Object.values(mapa)) })
    RED.sel.clear(); fecharModal(); renderRedistribuir()
    toast(`✓ ${cods.length} proposta(s) redistribuída(s)`)
  } catch(e) { toast('Erro: ' + e.message, true) }
}
function modalDividir() {
  if (!RED.sel.size) { toast('Marque as propostas primeiro.', true); return }
  const ativos = pessoasAtivas(RED.sis, RED.campo)
  abrirModal(`<h3>Dividir ${RED.sel.size} proposta(s) igualmente</h3><div class="m-sub">Distribui em rodízio entre as pessoas marcadas.</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px 16px">${ativos.map(n => `<label class="ms-opcao"><input type="checkbox" class="div-p" value="${esc(n)}" checked> ${esc(n)}</label>`).join('')}</div>
    <div class="modal-acoes"><button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn btn-pri" onclick="const p=[...document.querySelectorAll('.div-p:checked')].map(i=>i.value); if(!p.length){toast('Marque alguém.',true);return} aplicarRedistribuicao('dividir', p)">Dividir</button></div>`)
}

// ════════════ REGISTRO DE AÇÕES ════════════
async function renderLog() {
  const el = document.getElementById('conteudo')
  el.innerHTML = '<div class="carregando"><div class="spinner"></div></div>'
  try {
    const l = await api('admin_log?select=*&order=criado_em.desc&limit=300')
    el.innerHTML = `<div class="card"><div class="card-titulo">📜 Registro de ações</div><div class="card-sub">Tudo o que foi alterado pelo Administrador (últimas 300 ações).</div>
      <div class="tab-wrap"><table class="t"><thead><tr><th>Quando</th><th>Quem</th><th>Sistema</th><th>Ação</th><th>Detalhes</th></tr></thead><tbody>
      ${(l || []).map(x => `<tr><td style="white-space:nowrap">${new Date(x.criado_em).toLocaleString('pt-BR')}</td><td>${esc(x.usuario)}</td><td>${x.sistema ? `<span class="chip-sis chip-${x.sistema}">${SIS[x.sistema] ? SIS[x.sistema].curto : esc(x.sistema)}</span>` : ''}</td><td><b>${esc(x.acao)}</b></td><td class="mono" style="font-size:11.5px;max-width:560px;white-space:normal">${esc(JSON.stringify(x.detalhes))}</td></tr>`).join('') || '<tr><td colspan="5" class="vazio">Nenhuma ação registrada ainda.</td></tr>'}
      </tbody></table></div></div>`
  } catch(e) { el.innerHTML = `<div class="alerta alerta-erro">Não foi possível ler o registro: ${esc(e.message)}</div>` }
}

// ════════════ INÍCIO ════════════
async function iniciarApp() {
  document.getElementById('tela-login').style.display = 'none'
  document.getElementById('app').style.display = ''
  document.getElementById('hdr-usuario').textContent = SESSAO.email || ''
  document.getElementById('conteudo').innerHTML = '<div class="carregando"><div class="spinner"></div>Carregando os dois sistemas...</div>'
  try {
    await carregarTudo()
    renderFiltros(); renderAba()
  } catch(e) {
    document.getElementById('conteudo').innerHTML = `<div class="alerta alerta-erro">Erro ao carregar os dados: ${esc(e.message)}</div>`
  }
}
;(function () {
  const s = ler('admin_sessao')
  if (s) { try { SESSAO = JSON.parse(s) } catch(e) { SESSAO = null } }
  if (SESSAO && SESSAO.refresh_token) iniciarApp()
  else document.getElementById('tela-login').style.display = 'flex'
})()

</script>
